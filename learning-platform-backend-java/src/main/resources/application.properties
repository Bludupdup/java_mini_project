# Server Port
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/codepath_learning
spring.datasource.username=postgres
spring.datasource.password=Bhoomi@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization (Runs schema.sql and data.sql if enabled)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Security & JWT Configuration
# Note: In production, pass this via environment variable JWT_SECRET
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Google Gemini LLM API (Backend Only)
# Pass your Gemini API Key here or via environment variable GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000
