# Server Port
server.port=8080

# In production the Node server in front of Spring passes on X-Forwarded-Proto
# (Render serves the site over HTTPS), so Spring knows the visitor used HTTPS
# and marks the login cookie Secure. Only local proxies are trusted.
server.forward-headers-strategy=native

# Local secrets (DB password, JWT secret) live in .env.local next to pom.xml.
# It is gitignored; copy .env.example to create it. Real environment variables
# with the same names win over the file. The second path is for starting the
# app from the repository root (for example with VS Code's Run button).
spring.config.import=optional:file:.env.local[.properties],optional:file:learning-platform-backend-java/.env.local[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codepath_learning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
# A few connections are plenty, and each one costs memory.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Flyway creates and updates the tables from src/main/resources/db/migration.
# Placeholders are off because lesson text may contain "${...}".
spring.flyway.placeholder-replacement=false

# Hibernate only checks that the entities match the tables Flyway made.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Loads lists (steps, problems, ...) for many topics in one query instead of one each.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JSON: leave out fields that are null.
spring.jackson.default-property-inclusion=non_null

# Login sessions: a signed JWT in an HttpOnly cookie.
# Without JWT_SECRET a random key is made at startup, so logins end on restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.lifetime=7d

# Browser origins allowed to call the API directly. The Vite dev server
# proxies /api, so the React app normally doesn't need this.
cors.allowed-origins=http://localhost:5173,http://localhost:4173
