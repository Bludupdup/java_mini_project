# Tests use the same PostgreSQL database, but their own schema (it_test), so
# they never touch the app's real data. Flyway wipes and rebuilds it per run.
spring.datasource.hikari.schema=it_test
spring.flyway.schemas=it_test
spring.flyway.default-schema=it_test
spring.flyway.clean-disabled=false
spring.jpa.properties.hibernate.default_schema=it_test

# A fixed secret, so tokens don't depend on a random key.
app.jwt.secret=dGVzdC1zZWNyZXQtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHMyNTYtc2lnbmluZw==
